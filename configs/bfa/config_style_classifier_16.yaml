####################################
# The following are general settings
####################################

# Experiment name, more details in Section 'Experiment Name Explanation'
# NAME: my_PELearn_Diff_Latent1_MEncDec49_MdiffEnc49_bs64_clip_uncond75_01
# NAME: style_classifier_xiabfa_trans_linear0
NAME: style_classifier_16_1016
# Debug mode. Set to True will enter the debug mode, then the program will
# 1. use a tiny dataset for trianing and evaluation
# 2. validate more intensively
# 3. will not use `wandb logger`
DEBUG: False
VISUALIZE: False
# Devices. Optional: “cpu”, “gpu”
ACCELERATOR: 'gpu'
# Index of GPUs eg. [0] or [0,1,2,3]
DEVICE: [0]
NUM_STYLES: 16

#####################################
# The following are training settings
#####################################
TRAIN:
  # Model stage. Optional: "vae", "diffusion"
  STAGE: style_classifier
  DO_FORWARD: False
  # Training dataset name
  DATASETS: ['bfa']
  # Number of dataloader workers
  NUM_WORKERS: 1
  # Size of batches
  BATCH_SIZE: 256 # single: 64
  # Total epochs for training
  END_EPOCH: 200
  PRETRAINED_CLASSIFIER: ''
  # Resume
  # RESUME: '' # Resume training from this path
  # START_EPOCH: 599
  OPTIM:
    TYPE: AdamW # Optimizer type
    LR: 1e-4 # Learning rate
  # Ablation study configurations.
  ABLATION:
    SKIP_CONNECT: True
    PE_TYPE: mld
    DIFF_PE_TYPE: mld
    CONDITIONS_MIX: concat # cross_attn


#####################################
# The following are validation settings
#####################################
EVAL:
  DATASETS: ['bfa'] # Evaluating datasets
  BATCH_SIZE: 32 # Evaluating Batch size
  SPLIT: test

#####################################
# The following are testing settings
#####################################
TEST:
  CHECKPOINTS: ./experiments/most/style_classifier_xiabfa_trans8/checkpoints/epoch=199.ckpt # Pretrained model path
  DATASETS: ['bfa'] # training datasets
  SPLIT: test
  BATCH_SIZE: 32 # training Batch size
  MEAN: False
  NUM_SAMPLES: 1
  FACT: 1
  REPLICATION_TIMES: 1

TESTSET1:
  DATASETS: ['bfa']
  NUM_STYLES: 16

#####################################
# The following are basic datasets settings
#####################################
DATASET:
  JOINT_TYPE: 'humanml3d' # join type

#####################################
# The following are metric settings
#####################################
METRIC:
  TYPE: ['ClassifyMetrics']
  Classify_topk: 1

#####################################
# The following are training losses settings
#####################################
LOSS:
  TYPE: difusion # Losses type
  LAMBDA_CLASSIFY: 1.0 # Lambda for latent Losses

#####################################
# The following are basic model settings
#####################################
model:
  vae: true # whether vae model
  vae_type: mld # model type
  model_type: difusion # model type
  condition: 'style_classifier'
  num_styles: 16
  latent_dim: [1, 256] # latent dimension
  ff_size: 1024 #
  num_layers: 9 # number of layers
  num_head: 4 # number of head layers
  droupout: 0.1 # dropout rate
  activation: gelu # activation type
  guidance_scale: 7.5 #
  guidance_uncondp: 0.1 # 0.1 0.25

#####################################
# The following are loggers settings
#####################################
LOGGER:
  SAVE_CHECKPOINT_EPOCH: 50
  LOG_EVERY_STEPS: 1
  VAL_EVERY_STEPS: 10
  TENSORBOARD: True
  WANDB:
    PROJECT: null
    OFFLINE: False
    RESUME_ID: null
